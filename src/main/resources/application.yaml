spring:
  application:
    name: lab-admin-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:labdb}
    username: ${DB_USER:labuser}
    password: ${DB_PASSWORD:labpassword}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 30